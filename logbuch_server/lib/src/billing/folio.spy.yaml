### The account of one payer for one booking: what they are charged and
### what they paid.
class: Folio
table: folios
fields:
  booking: Booking?, relation(onDelete=Restrict)
  payer: Contact?, relation(onDelete=Restrict)
  status: FolioStatus, default=open
  ### Given once when the folio is invoiced and never changed afterwards.
  invoiceNumber: String?
  ### The day of the invoice.
  invoicedAt: DateTime?
  charges: List<Charge>?, relation(name=folio_charges)
  payments: List<Payment>?, relation(name=folio_payments)
indexes:
  folios_booking_payer_idx:
    fields: bookingId, payerId
    unique: true
  folios_invoice_number_idx:
    fields: invoiceNumber
    unique: true
