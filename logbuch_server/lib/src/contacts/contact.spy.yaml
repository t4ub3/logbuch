class: Contact
table: contacts
fields:
  createdAt: DateTime, default=now
  firstName: String
  lastName: String
  mail: String?
  phone: String?
  birthDate: DateTime?
  street: String?
  zip: String?
  city: String?
  country: String?
  organization: Organization?, relation(optional, onDelete=SetNull)
  notes: String?
  privacyConsentAt: DateTime?
