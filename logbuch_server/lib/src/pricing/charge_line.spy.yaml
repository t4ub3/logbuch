### One position of what a booking costs. Amounts are in cents and include
### the tax.
class: ChargeLine
fields:
  ### Null for what is charged per booking or per room.
  guestId: int?
  ### The room of the booking that a line without a guest is charged for.
  ### Null for what is charged per booking.
  bookingRoomId: int?
  type: ChargeType
  description: String
  quantity: int
  unitPrice: int
  total: int
  ### In basis points.
  taxRate: int
  ### First night and day after the last night of a line charged per night.
  periodFrom: DateTime?
  periodTo: DateTime?
