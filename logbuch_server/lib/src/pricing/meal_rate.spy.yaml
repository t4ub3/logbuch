class: MealRate
table: meal_rates
fields:
  priceListId: int, relation(parent=price_lists, onDelete=Cascade)
  mealPlanId: int, relation(parent=meal_plans, onDelete=Cascade)
  ageGroupId: int, relation(parent=age_groups, onDelete=Cascade)
  pricePerNight: int
indexes:
  meal_rates_unique_idx:
    fields: priceListId, mealPlanId, ageGroupId
    unique: true
