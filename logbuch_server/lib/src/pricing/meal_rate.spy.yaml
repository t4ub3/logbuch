class: MealRate
table: meal_rates
fields:
  seasonId: int, relation(parent=seasons, onDelete=Cascade)
  mealPlanId: int, relation(parent=meal_plans, onDelete=Cascade)
  ageGroupId: int, relation(parent=age_groups, onDelete=Cascade)
  pricePerNight: int
indexes:
  meal_rates_unique_idx:
    fields: seasonId, mealPlanId, ageGroupId
    unique: true
