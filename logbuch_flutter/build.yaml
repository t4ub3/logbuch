targets:
  $default:
    builders:
      slang_build_runner:
        options:
          base_locale: en
          # Load all locales eagerly so the synchronous LocaleSettings.*Sync
          # methods can switch to any of them.
          lazy: false
          fallback_strategy: base_locale
          input_directory: lib/i18n
          input_file_pattern: .i18n.json
          output_directory: lib/i18n
          output_file_name: strings.g.dart
          string_interpolation: braces
